name: Host portability

on:
  push:
    branches: [windows-portability, presentation-api, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Host filesystem and network (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure C++17 host portability tests
        run: cmake -S runtime/tests/portability -B build/portability -G Ninja
      - name: Build
        run: cmake --build build/portability
      - name: Test
        run: ctest --test-dir build/portability --output-on-failure
